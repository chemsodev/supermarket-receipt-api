name: "CI"

"on": ["push"]

permissions:
  contents: "read"

jobs:
  ci:
    name: "CI Workflow"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false
      - name: "Installer uv"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          enable-cache: false
          python-version: "3.13"
      - name: "Synchroniser les dépendances"
        run: uv sync --locked
      - name: "Vérifier le lint avec Ruff"
        run: uv run ruff check .
      - name: "Vérifier le formatage avec Ruff"
        run: uv run ruff format --check .
      - name: "Exécuter les tests"
        run: uv run pytest tests/unit --cov=supermarket_receipt_api.checkout --cov-report=term-missing
